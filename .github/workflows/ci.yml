name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package (smoke test)
        run: npx vsce package --readme-path docs/MARKETPLACE.md --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
