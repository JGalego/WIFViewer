name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "refs/tags/v$v" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF does not match package.json version $v" >&2
            exit 1
          fi
      - name: Package
        run: npx vsce package --readme-path docs/MARKETPLACE.md
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
